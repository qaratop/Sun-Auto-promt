<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoonAI — Быстрый старт промпта</title>
<style>
  :root{
    --violet:#6C4CF1;
    --violet-dark:#5A3CE0;
    --violet-light:#F1EDFE;
    --violet-line:#DDD4FB;
    --bg:#F7F7FB;
    --card:#FFFFFF;
    --border:#E7E7EF;
    --text:#16161F;
    --text-soft:#767689;
    --text-faint:#A6A6B5;
    --green:#1E8E5A;
    --green-bg:#EAF7F0;
    --mono: 'SFMono-Regular', Consolas, 'JetBrains Mono', monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{ box-sizing:border-box; }
  html, body{ margin:0; padding:0; }
  #moonai-root{
    font-family: var(--sans); background: var(--bg); color: var(--text);
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .shell{ max-width: 920px; margin:0 auto; padding: 24px 20px 60px; }

  .pagehead{ margin-bottom: 20px; }
  .pagehead h1{ font-size:22px; font-weight:700; margin:0 0 4px; display:flex; align-items:center; gap:8px; }
  .pagehead .sub{ font-size:13.5px; color:var(--text-soft); }
  .pill-help{ width:16px;height:16px;border-radius:50%; border:1.4px solid var(--text-faint); color:var(--text-faint); font-size:11px; display:inline-flex; align-items:center; justify-content:center; }

  .card{ background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px 22px 20px; box-shadow: 0 1px 2px rgba(20,20,40,0.03); }
  .card + .card{ margin-top:18px; }

  .label-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:4px; }
  .field-label{ font-size:14px; font-weight:600; color:var(--text); }
  .fill-example{ flex-shrink:0; font-size:12px; font-weight:600; color: var(--violet-dark); background: var(--violet-light); border: 1px solid var(--violet-line); padding: 5px 10px; border-radius: 7px; cursor:pointer; white-space:nowrap; }
  .fill-example:hover{ background: var(--violet-line); }
  .field-hint{ font-size:12.5px; color:var(--text-soft); margin-bottom:12px; line-height:1.5; }
  .micro-hint{ font-size:11.5px; color:var(--text-faint); margin:-6px 0 12px; line-height:1.4; }

  .name-input{ margin-bottom: 12px; }
  .name-input label{ display:block; font-size:12px; font-weight:600; color:var(--text-soft); margin-bottom:5px; }

  .chiprow{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px; }
  .chip{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); background:#fff; padding:6px 11px 6px 8px; border-radius:999px; font-size:12px; color: var(--text-soft); cursor:pointer; user-select:none; transition: background .12s ease, border-color .12s ease, color .12s ease; }
  .chip .box{ width:14px; height:14px; border-radius:4px; border:1.4px solid var(--text-faint); display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
  .chip .box svg{ width:9px; height:9px; opacity:0; }
  .chip.checked{ background: var(--violet-light); border-color: var(--violet-line); color: var(--violet-dark); font-weight:600; }
  .chip.checked .box{ background: var(--violet); border-color: var(--violet); }
  .chip.checked .box svg{ opacity:1; }

  .progress-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .progress-label{ font-size:12.5px; color:var(--text-soft); font-weight:500; }
  .progress-track{ flex:1; height:6px; background:var(--border); border-radius:4px; margin:0 14px; overflow:hidden; }
  .progress-fill{ height:100%; background: linear-gradient(90deg, var(--violet), #9B7CFF); border-radius:4px; transition: width .25s ease; }
  .progress-count{ font-size:12.5px; color:var(--text-faint); font-variant-numeric: tabular-nums; }

  textarea, input[type=text]{ width:100%; background:#FBFBFD; border:1px solid var(--border); border-radius:10px; padding:12px 13px; font-family: var(--sans); font-size:14px; color:var(--text); line-height:1.55; outline:none; transition: border-color .15s ease, background .15s ease; }
  textarea{ min-height:104px; resize:vertical; }
  textarea:focus, input[type=text]:focus{ border-color: var(--violet); background:#FFFFFF; }
  textarea::placeholder, input::placeholder{ color: var(--text-faint); }

  .nav{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; }
  .btnrow{ display:flex; gap:10px; flex-wrap:wrap; }

  button{ font-family: var(--sans); font-size:13.5px; font-weight:600; border-radius:9px; padding:10px 16px; cursor:pointer; border:1px solid transparent; display:inline-flex; align-items:center; gap:7px; transition: opacity .15s ease, transform .08s ease; }
  button:active{ transform: scale(0.98); }
  button:disabled{ opacity:.35; cursor:not-allowed; }
  .btn-primary{ background: var(--violet); color:#fff; }
  .btn-primary:hover:not(:disabled){ background: var(--violet-dark); }
  .btn-outline{ background:#fff; color:var(--text); border-color:var(--border); }
  .btn-outline:hover:not(:disabled){ border-color: var(--text-faint); }
  .btn-text{ background:transparent; color:var(--text-soft); padding:10px 8px; }
  .sparkle{ width:14px; height:14px; flex-shrink:0; }

  .answered-list{ margin-top:2px; }
  .answered-item{ padding:10px 0; border-bottom:1px solid var(--border); }
  .answered-item:last-child{ border-bottom:none; }
  .answered-item .k{ font-size:12px; color:var(--text-soft); font-weight:600; margin-bottom:3px; }
  .answered-item .v{ font-size:13.5px; color:var(--text); line-height:1.5; }
  .answered-item .v.placeholder{ color: var(--text-faint); font-style:italic; }

  .badge-status{ display:inline-flex; align-items:center; gap:5px; background:var(--green-bg); color:var(--green); font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px; }
  .badge-status .dot{ width:6px;height:6px;border-radius:50%; background:var(--green); }

  .final-output{ width:100%; background:#FBFBFD; border:1px solid var(--border); border-radius:10px; padding:16px; font-family: var(--mono); font-size:12.5px; line-height:1.65; white-space:pre-wrap; max-height:460px; overflow-y:auto; color: var(--text); }
  .final-output::-webkit-scrollbar{ width:6px; }
  .final-output::-webkit-scrollbar-thumb{ background:#D9D9E6; border-radius:3px; }
  .copied-flag{ font-size:12px; color: var(--violet-dark); font-weight:600; }
  .note{ font-size:12px; color: var(--text-faint); margin-top:12px; line-height:1.6; }
  .section-title{ font-size:15px; font-weight:700; margin:0 0 2px; }
  .section-sub{ font-size:12.5px; color: var(--text-soft); margin-bottom:16px; }

  .result-tabs{ display:inline-flex; gap:3px; background: var(--border); padding:3px; border-radius:10px; margin-bottom:18px; }
  .result-tab{ padding:8px 15px; border-radius:8px; font-size:13px; font-weight:600; color:var(--text-soft); cursor:pointer; user-select:none; }
  .result-tab.active{ background:#fff; color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,0.06); }

  .func-toprow{ display:grid; grid-template-columns:1fr; gap:14px; margin-bottom:18px; }
  @media(min-width:640px){ .func-toprow{ grid-template-columns: 1fr 1fr; } }
  .func-field label{ display:block; font-size:12px; font-weight:600; color:var(--text-soft); margin-bottom:6px; }
  .func-static{ background:#FBFBFD; border:1px solid var(--border); border-radius:9px; padding:10px 12px; font-size:13.5px; font-family: var(--mono); color: var(--text); }
  .func-static.desc{ white-space:pre-wrap; line-height:1.5; font-family: var(--sans); }

  .status-row{ display:flex; align-items:center; gap:10px; margin-bottom: 18px; }
  .toggle-fake{ width:34px; height:19px; border-radius:999px; background: var(--violet); position:relative; flex-shrink:0; }
  .toggle-fake::after{ content:""; position:absolute; right:2px; top:2px; width:15px; height:15px; border-radius:50%; background:#fff; }
  .status-row .lbl{ font-size:13px; font-weight:600; }

  .param-card{ border:1px solid var(--border); border-radius:11px; padding:14px 14px 12px; margin-bottom:10px; background:#FBFBFD; }
  .param-grid{ display:grid; grid-template-columns: 1fr; gap:10px; }
  @media(min-width:640px){ .param-grid{ grid-template-columns: 0.9fr 0.7fr 1.4fr; } }
  .param-field label{ display:block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--text-faint); margin-bottom:4px; }
  .param-value{ font-size:13px; background:#fff; border:1px solid var(--border); border-radius:7px; padding:8px 10px; color:var(--text); font-family: var(--mono); }
  .param-value.type{ font-family: var(--sans); }
  .required-tag{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; margin-top:10px; color: var(--text-faint); }
  .required-tag .box{ width:14px; height:14px; border-radius:4px; border:1.4px solid var(--text-faint); display:inline-flex; align-items:center; justify-content:center; }
  .required-tag.on{ color: var(--violet-dark); font-weight:600; }
  .required-tag.on .box{ background: var(--violet); border-color: var(--violet); }
  .required-tag .box svg{ width:9px; height:9px; }
</style>
</head>
<body>

<div id="moonai-root">
  <div class="shell">
    <div class="pagehead">
      <h1>Быстрый старт промпта <span class="pill-help">?</span></h1>
      <div class="sub">7 вопросов — и вы получите промпт для агента и заготовку функции для сохранения данных клиента.</div>
    </div>
    <div id="wizardArea"></div>
  </div>
</div>

<script>
(function(){
  const SPARK = '<svg class="sparkle" viewBox="0 0 24 24" fill="none"><path d="M12 2l1.8 5.6L19 9l-5.2 1.4L12 16l-1.8-5.6L5 9l5.2-1.4L12 2z" fill="currentColor"/></svg>';
  const CHECK = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4 10-10" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const QUESTIONS = [
    { key:"company", title:"Как называется ваша школа и чем она занимается?",
      hint:"Название и пару предложений: формат обучения, аудитория, какую пользу даёте.",
      placeholder:"Онлайн школа английского языка. Обучаем индивидуально, в группах, готовим к экзаменам...",
      hasName:true, namePlaceholder:"Например: Just To Study",
      example:{ name:"Just To Study", text:"Онлайн школа английского языка. Обучили более 20 000 студентов и помогли им достичь своих целей: поступление за рубеж, трудоустройство, сдача международных экзаменов и повышение уровня английского языка." },
      chips:["Индивидуальные занятия","Групповые занятия","Подготовка к IELTS/TOEFL","Детский английский","Корпоративное обучение"],
      microHint:"Чем подробнее опишете — тем точнее агент будет отвечать 🙂" },
    { key:"goal", title:"К чему должен довести клиента агент?",
      hint:"Ключевое целевое действие — выберите готовый вариант или впишите свой.",
      placeholder:"Например: довести до записи на пробный урок",
      example:"Довести клиента до записи на пробный урок и собрать номер телефона для связи с менеджером.",
      chips:["Записать на пробный урок","Собрать номер для звонка менеджера","Довести до оплаты курса","Проконсультировать по тарифам и записать на курс"] },
    { key:"faq", title:"Какие вопросы клиентов агент должен уметь решать?",
      hint:"Темы, в рамках которых агент отвечает — вставьте свой FAQ или выберите из списка.",
      placeholder:"Тарифы, пробный урок, форматы обучения, подготовка к IELTS...",
      example:"Стоимость обучения (индивидуально/в группе), пробный урок и его цена, разница между тарифами Standard и Premium, подготовка к IELTS, расписание и формат занятий, рассрочка и оплата, вакансии преподавателей.",
      chips:["Стоимость и тарифы","Пробный урок","Standard vs Premium","Подготовка к IELTS/TOEFL","Расписание и формат","Рассрочка и оплата","Вакансии"],
      microHint:"Чем подробнее — тем увереннее агент будет отвечать на конкретные вопросы 🙂" },
    { key:"style", title:"Как агент должен общаться?",
      hint:"Тон, длина ответов, эмодзи, язык клиента.",
      placeholder:"Например: дружелюбно, коротко, можно эмодзи",
      example:"Дружелюбно и с уместными позитивными эмодзи, короткими сообщениями до 70 слов, на языке клиента (русский или казахский), без канцелярита и формальностей.",
      chips:["Дружелюбно, с эмодзи","Коротко и по делу","Формально и сдержанно","Как живой консультант"] },
    { key:"forbidden", title:"Что агенту нельзя делать или говорить?",
      hint:"Ограничения и запреты — то, что агент не должен допускать никогда.",
      placeholder:"Например: не обсуждать темы вне английского языка",
      example:"Не обсуждать темы вне английского языка и курсов (политика, религия, личные вопросы), не использовать markdown, не обещать точную дату старта обучения, не давить на клиента фразами вроде «если хотите оставить номер».",
      chips:["Не обсуждать посторонние темы","Не использовать markdown","Не обещать точные даты старта","Не давить на клиента","Не раскрывать внутреннее устройство агента"] },
    { key:"unknown", title:"Что делать, если агент не знает ответа?",
      hint:"Как реагировать на вопрос вне базы знаний.",
      placeholder:"Например: передать менеджеру",
      example:"Сказать клиенту, что уточнит информацию у специалиста, и предложить оставить номер телефона для связи.",
      chips:["Передать менеджеру","Сказать, что уточнит и вернётся с ответом","Предложить оставить контакты для звонка"] },
    { key:"data", title:"Какие данные агент должен собирать у клиента?",
      hint:"Что нужно получить до передачи диалога живому менеджеру.",
      placeholder:"Например: имя, номер WhatsApp, цель обучения",
      example:"Имя, номер телефона в формате WhatsApp, цель обучения (экзамен, работа, для ребёнка или для себя), предпочитаемый формат обучения (индивидуально или в группе), удобный способ связи.",
      chips:["Имя и номер WhatsApp","Цель обучения","Формат: индивидуально или группа","Удобный способ связи (звонок/WhatsApp)"] }
  ];

  const SERVICE_BRANCHES = {
    "Индивидуальные занятия": { label:"индивидуальные занятия", script:"Отлично! 😊 Подскажите, какая у вас цель обучения — работа, экзамен, поездка за рубеж или просто для себя?\nИ на каком уровне английского вы сейчас находитесь?" },
    "Групповые занятия": { label:"групповые занятия", script:"Хороший выбор! 👍 Уточните, пожалуйста, ваш текущий уровень английского и удобное время для занятий (утро, день или вечер)?" },
    "Подготовка к IELTS/TOEFL": { label:"подготовка к IELTS/TOEFL", script:"Понимаю! 🎯 На какой балл вы готовитесь и когда планируете сдавать экзамен?" },
    "Детский английский": { label:"обучение ребёнка", script:"Отлично! 👶 Уточните возраст ребёнка и его текущий уровень английского (если уже занимался)." },
    "Корпоративное обучение": { label:"корпоративное обучение", script:"Подскажите, пожалуйста, сколько сотрудников хотите обучать и какая цель — общий английский или для работы?" }
  };

  function buildStep2(a){
    const chosen = (a.company||"").split(",").map(s=>s.trim()).filter(c => SERVICE_BRANCHES[c]);
    if (!chosen.length){
      return `2. Уточни запрос. По смыслу ответа клиента задай уточняющие вопросы под тему (цель обучения, уровень английского, формат занятий, возраст ребёнка и т.п.).\n\nЕсли вопрос не подходит ни под одну тему:\nОпишите, пожалуйста, ваш вопрос — постараюсь помочь или передам менеджеру 😊`;
    }
    let out = "";
    chosen.forEach((c, i) => {
      const b = SERVICE_BRANCHES[c];
      const num = i === 0 ? "2" : `2.${i}`;
      out += `${num}. Если клиент выбрал «${b.label}» — напиши:\n${b.script}\n\n`;
    });
    out += `2.${chosen.length}. Если запрос не подходит ни под одну тему выше — напиши:\nОпишите, пожалуйста, ваш вопрос — постараюсь помочь или передам менеджеру 😊`;
    return out;
  }

  const GOAL_FUNCTION_MAP = [
    { match:"Записать на пробный урок", name:"new_trial_lesson" },
    { match:"Собрать номер для звонка менеджера", name:"new_lead" },
    { match:"Довести до оплаты курса", name:"new_payment_request" },
    { match:"Проконсультировать по тарифам и записать на курс", name:"new_lead" }
  ];

  const DATA_PARAM_MAP = {
    "Цель обучения": [{ name:"study_goal", type:"Текстовый", instruction:"Цель обучения клиента (экзамен, работа, переезд, для себя и т.п.)" }],
    "Формат: индивидуально или группа": [{ name:"study_format", type:"Текстовый", instruction:"Предпочитаемый формат обучения — индивидуально или в группе" }],
    "Удобный способ связи (звонок/WhatsApp)": [{ name:"contact_method", type:"Текстовый", instruction:"Удобный способ связи с клиентом — звонок или переписка в WhatsApp" }]
  };

  const state = { step:0, answers:{}, finished:false, resultTab:"prompt", funcTab:"primary" };

  function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function slug(s){ return (s||"").toLowerCase().trim(); }

  function toggleChip(key, chipText){
    let val = state.answers[key] || "";
    let parts = val.split(",").map(s=>s.trim()).filter(Boolean);
    const idx = parts.indexOf(chipText);
    if (idx >= 0) parts.splice(idx,1); else parts.push(chipText);
    state.answers[key] = parts.join(", ");
    render();
  }

  function fillExample(q){
    if (q.hasName){ state.answers.company_name = q.example.name; state.answers[q.key] = q.example.text; }
    else { state.answers[q.key] = q.example; }
    render();
  }

  function buildPrompt(a, funcName){
    const get = (k, fb) => (a[k] && a[k].trim()) ? a[k].trim() : fb;
    const companyName = get("company_name", "[название компании не заполнено]");
    const company = get("company", "[описание компании не заполнено]");
    const goal = get("goal", "[целевое действие не заполнено]");
    const faq = get("faq", "[темы FAQ не заполнены]");
    const style = get("style", "[стиль общения не заполнен]");
    const forbidden = get("forbidden", "[ограничения не заполнены]");
    const unknown = get("unknown", "сообщить клиенту, что уточнит информацию, и передать диалог менеджеру");
    const data = get("data", "[какие данные собирать — не заполнено]");
    const step2 = buildStep2(a);
    const fn = funcName || "get_info";

    return `Ты — виртуальный ассистент компании ${companyName}.
Твоя задача — отвечать на вопросы клиентов, собирать их данные и передавать для консультации менеджеру.

🎯 Основные принципы работы:
1. Только по теме: отвечай только на вопросы, касающиеся ${company}. Если вопрос не по теме — вежливо направляй обратно к теме.
2. Язык общения: пиши на языке клиента (русский, казахский или другой). Можно менять язык по ходу диалога, но не смешивай языки в одном сообщении.
3. Грамотность: проверяй сообщения на ошибки перед отправкой.
4. Простота и человечность: пиши просто и по-человечески, как реальный человек, без канцелярита. Разбивай длинные ответы на смысловые блоки.
5. Эмодзи: используй уместные эмодзи, где это естественно.
6. Краткость: старайся отвечать в 2–4 предложениях, не вываливай всю информацию сразу — выдавай постепенно.
7. Не выдумывай: не придумывай факты, цены, сроки и условия, которых нет в этом промпте или базе знаний — лучше скажи, что уточнишь.
8. Стиль общения: ${style}
9. Что запрещено: ${forbidden}
10. Если не знаешь ответа: ${unknown}. Вызови функцию get_manager — собери суть запроса клиента, категорию вопроса, его имя и номер телефона, и передай их менеджеру. Клиенту сообщи, что с ним скоро свяжется специалист и всё объяснит.
11. Уточни, для кого клиент рассматривает услугу — для себя или для ребёнка, если это важно для вашей ниши.
12. Никогда не записывай клиента на точное время звонка — сообщи, что с ним свяжется менеджер в ближайшее время в рабочее время.
13. Когда спрашиваешь номер телефона — клиент должен написать его цифрами, а не текстом («этот номер» не подходит, нужны сами цифры).

  function pickFunctionName(goalText){
    if (!goalText) return "new_lead";
    for (const m of GOAL_FUNCTION_MAP){ if (goalText.includes(m.match)) return m.name; }
    return "new_lead";
  }

  function buildFunctionSpec(a){
    const dataVal = (a.data||"").trim();
    const parts = dataVal.split(",").map(s=>s.trim()).filter(Boolean);
    let params = [
      { name:"client_name", type:"Текстовый", instruction:"Имя клиента", required:true },
      { name:"client_phone", type:"Текстовый", instruction:"Номер телефона клиента (WhatsApp)", required:true }
    ];
    let leftover = [];
    parts.forEach(p => {
      if (p === "Имя и номер WhatsApp") return;
      if (DATA_PARAM_MAP[p]) { params = params.concat(DATA_PARAM_MAP[p]); }
      else leftover.push(p);
    });
    if (leftover.length){
      params.push({ name:"client_note", type:"Текстовый", instruction: leftover.join("; "), required:false });
    }
    const primary = {
      name: pickFunctionName(a.goal||""),
      description: "Когда клиент ответил на все вопросы и отправил свои данные — сохрани данные клиента и передай их менеджеру.",
      params
    };
    const escalate = {
      name: "get_manager",
      description: "Когда ты не знаешь ответа на вопрос клиента, или вопрос выходит за рамки базы знаний — сохрани суть запроса и передай его менеджеру.",
      params: [
        { name:"client_name", type:"Текстовый", instruction:"Имя клиента", required:true },
        { name:"client_phone", type:"Текстовый", instruction:"Номер телефона клиента (WhatsApp)", required:true },
        { name:"client_query", type:"Текстовый", instruction:"Суть запроса клиента — что именно он спросил", required:true },
        { name:"category", type:"Текстовый", instruction:"Категория вопроса (например: цены, документы, техническая проблема, жалоба)", required:false }
      ]
    };
    return { primary, escalate };
  }

  function chipsHtml(q){
    if (!q.chips) return "";
    const current = (state.answers[q.key]||"").split(",").map(s=>s.trim());
    let html = '<div class="chiprow">';
    q.chips.forEach((c) => {
      const checked = current.includes(c);
      html += `<label class="chip ${checked?'checked':''}" data-chip="${esc(c)}" data-key="${q.key}"><span class="box">${CHECK}</span>${esc(c)}</label>`;
    });
    html += '</div>';
    return html;
  }

  function render(){
    const area = document.getElementById("wizardArea");
    if (state.finished){ renderDone(area); return; }

    const q = QUESTIONS[state.step];
    const total = QUESTIONS.length;
    const value = state.answers[q.key] || "";
    const pct = Math.round((state.step/total)*100);

    let answeredHtml = "";
    for (let i=0;i<state.step;i++){
      const qq = QUESTIONS[i];
      const v = state.answers[qq.key];
      const label = qq.hasName && state.answers.company_name ? `${state.answers.company_name} — ${v||''}` : v;
      answeredHtml += `<div class="answered-item"><div class="k">${esc(qq.title)}</div><div class="v ${label ? "" : "placeholder"}">${label ? esc(label) : "пропущено"}</div></div>`;
    }

    area.innerHTML = `
      <div class="card">
        <div class="progress-row">
          <span class="progress-label">Вопрос ${state.step+1} из ${total}</span>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <span class="progress-count">${pct}%</span>
        </div>
        <div class="label-row">
          <div class="field-label">${esc(q.title)}</div>
          <div class="fill-example" id="fillExampleBtn">✨ Заполнить примером</div>
        </div>
        <div class="field-hint">${esc(q.hint)}</div>
        ${q.microHint ? `<div class="micro-hint">${esc(q.microHint)}</div>` : ""}
        ${q.hasName ? `<div class="name-input"><label>Название компании</label><input type="text" id="nameInput" placeholder="${esc(q.namePlaceholder)}" value="${esc(state.answers.company_name||"")}"></div>` : ""}
        ${chipsHtml(q)}
        <textarea id="answerInput" placeholder="${esc(q.placeholder)}">${esc(value)}</textarea>
        <div class="nav">
          <button class="btn-text" id="backBtn" ${state.step===0 ? "disabled":""}>← Назад</button>
          <div class="btnrow"><button class="btn-primary" id="nextBtn">${SPARK}${state.step===total-1 ? "Собрать промпт" : "Далее"}</button></div>
        </div>
      </div>
      ${answeredHtml ? `<div class="card"><div class="section-title">Уже отвечено</div><div class="section-sub">Можно вернуться назад и изменить любой ответ.</div><div class="answered-list">${answeredHtml}</div></div>` : ""}
    `;

    const ta = document.getElementById("answerInput");
    ta.addEventListener("input", (e) => { state.answers[q.key] = e.target.value; });
    ta.focus(); ta.selectionStart = ta.value.length;

    if (q.hasName){
      document.getElementById("nameInput").addEventListener("input", (e) => { state.answers.company_name = e.target.value; });
    }
    document.getElementById("fillExampleBtn").addEventListener("click", () => fillExample(q));
    area.querySelectorAll(".chip").forEach(chip => {
      chip.addEventListener("click", () => toggleChip(chip.dataset.key, chip.dataset.chip));
    });
    document.getElementById("backBtn").addEventListener("click", () => { if (state.step>0){ state.step--; render(); } });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.answers[q.key] = ta.value;
      if (state.step === total-1){ state.finished = true; render(); }
      else { state.step++; render(); }
    });
  }

  function paramCardHtml(p){
    return `<div class="param-card">
      <div class="param-grid">
        <div class="param-field"><label>Название</label><div class="param-value">${esc(p.name)}</div></div>
        <div class="param-field"><label>Тип параметра</label><div class="param-value type">${esc(p.type)}</div></div>
        <div class="param-field"><label>Инструкция</label><div class="param-value type">${esc(p.instruction)}</div></div>
      </div>
      <div class="required-tag ${p.required ? "on":""}"><span class="box">${p.required?CHECK:""}</span>Обязательный параметр</div>
    </div>`;
  }

  function renderDone(area){
    const func = buildFunctionSpec(state.answers);
    const promptText = buildPrompt(state.answers, func.primary.name);
    const specText = (f) => `Название: ${f.name}\nОписание: ${f.description}\n\nПараметры:\n` + f.params.map(p => `- ${p.name} (${p.type}${p.required ? ", обязательный" : ""}): ${p.instruction}`).join("\n");

    if (!state.funcTab) state.funcTab = "primary";

    area.innerHTML = `
      <div class="card">
        <div class="result-tabs">
          <div class="result-tab ${state.resultTab==='prompt'?'active':''}" id="tabPrompt">Промпт</div>
          <div class="result-tab ${state.resultTab==='function'?'active':''}" id="tabFunction">Функции</div>
        </div>
        <div id="resultBody"></div>
      </div>
    `;

    const body = document.getElementById("resultBody");

    if (state.resultTab === "prompt"){
      body.innerHTML = `
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px;">
          <div>
            <div class="section-title">Инструкция для агента</div>
            <div class="section-sub" style="margin-bottom:0;">Промпт собран по вашим ответам — можно отредактировать вручную перед сохранением.</div>
          </div>
          <span class="badge-status"><span class="dot"></span>Черновик готов</span>
        </div>
        <div class="final-output">${esc(promptText)}</div>
        <div class="nav">
          <button class="btn-text" id="editBtn">← Вернуться к вопросам</button>
          <div class="btnrow">
            <button class="btn-outline" id="downloadBtn">Скачать .txt</button>
            <button class="btn-outline" id="copyBtn">Скопировать</button>
            <button class="btn-primary" id="useBtn">${SPARK}Использовать в агенте</button>
          </div>
        </div>
        <div class="note" id="copyFlagNote"></div>
      `;
      document.getElementById("copyBtn").addEventListener("click", () => {
        navigator.clipboard.writeText(promptText).then(() => {
          const n = document.getElementById("copyFlagNote");
          n.innerHTML = '<span class="copied-flag">Скопировано ✓</span>';
          setTimeout(()=>{ if(n) n.innerHTML=""; }, 2000);
        });
      });
      document.getElementById("downloadBtn").addEventListener("click", () => {
        const blob = new Blob([promptText], {type:"text/plain;charset=utf-8"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a"); a.href = url; a.download = "moonai-agent-prompt.txt";
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
      });
      document.getElementById("useBtn").addEventListener("click", () => {
        document.getElementById("copyFlagNote").innerHTML = '<span class="copied-flag">Промпт вставлен в поле "Инструкция для агента" ✓</span>';
      });
      document.getElementById("editBtn").addEventListener("click", () => { state.finished = false; state.step = QUESTIONS.length-1; render(); });
    } else if (state.resultTab === "function") {
      const f = state.funcTab === "primary" ? func.primary : func.escalate;
      const funcSpecText = specText(f);
      body.innerHTML = `
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px;">
          <div>
            <div class="section-title">Детали функции</div>
            <div class="section-sub" style="margin-bottom:0;">Создайте обе функции во вкладке «Функции» вашего агента — параметры собраны из ваших ответов.</div>
          </div>
          <span class="badge-status"><span class="dot"></span>Черновик готов</span>
        </div>

        <div class="chiprow" style="margin-bottom:18px;">
          <label class="chip ${state.funcTab==='primary'?'checked':''}" id="funcSubPrimary"><span class="box">${state.funcTab==='primary'?CHECK:''}</span>${esc(func.primary.name)} — сбор данных клиента</label>
          <label class="chip ${state.funcTab==='escalate'?'checked':''}" id="funcSubEscalate"><span class="box">${state.funcTab==='escalate'?CHECK:''}</span>${esc(func.escalate.name)} — если бот не знает ответ</label>
        </div>

        <div class="func-toprow">
          <div class="func-field"><label>Название</label><div class="func-static">${esc(f.name)}</div></div>
        </div>
        <div class="func-field" style="margin-bottom:18px;"><label>Описание</label><div class="func-static desc">${esc(f.description)}</div></div>

        <div class="status-row"><div class="toggle-fake"></div><span class="lbl">Статус функции: активна</span></div>

        <div class="section-title" style="font-size:14px;">Параметры функции</div>
        <div class="section-sub">Можно добавить или переименовать параметры прямо в интерфейсе платформы.</div>
        <div id="paramsList">${f.params.map(paramCardHtml).join("")}</div>

        <div class="nav">
          <button class="btn-text" id="editBtn2">← Вернуться к вопросам</button>
          <div class="btnrow">
            <button class="btn-outline" id="downloadFuncBtn">Скачать .txt</button>
            <button class="btn-outline" id="copyFuncBtn">Скопировать</button>
          </div>
        </div>
        <div class="note" id="copyFlagNote2"></div>
      `;
      document.getElementById("funcSubPrimary").addEventListener("click", () => { state.funcTab = "primary"; renderDone(area); });
      document.getElementById("funcSubEscalate").addEventListener("click", () => { state.funcTab = "escalate"; renderDone(area); });
      document.getElementById("copyFuncBtn").addEventListener("click", () => {
        navigator.clipboard.writeText(funcSpecText).then(() => {
          const n = document.getElementById("copyFlagNote2");
          n.innerHTML = '<span class="copied-flag">Скопировано ✓</span>';
          setTimeout(()=>{ if(n) n.innerHTML=""; }, 2000);
        });
      });
      document.getElementById("downloadFuncBtn").addEventListener("click", () => {
        const blob = new Blob([funcSpecText], {type:"text/plain;charset=utf-8"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a"); a.href = url; a.download = `${f.name}-function.txt`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
      });
      document.getElementById("editBtn2").addEventListener("click", () => { state.finished = false; state.step = QUESTIONS.length-1; render(); });
    }

    document.getElementById("tabPrompt").addEventListener("click", () => { state.resultTab = "prompt"; renderDone(area); });
    document.getElementById("tabFunction").addEventListener("click", () => { state.resultTab = "function"; renderDone(area); });
  }

  render();
})();
</script>
